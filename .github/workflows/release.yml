name: Publish Multi-Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest  # Исправлено на runs-on

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # --- 1. СБОРКА: НЕ ТРЕБУЕТ DOTNET (Self-Contained ZIP) ---
    - name: Publish Self-Contained (No .NET required)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -o ./pub-self /p:PublishSingleFile=true /p:PublishReadyToRun=true /p:PublishTrimmed=false /p:IncludeNativeLibrariesForSelfExtract=true
        Compress-Archive -Path ./pub-self/* -DestinationPath ./PcMonitor_Autonomous_win-x64.zip

    # --- 2. СБОРКА: ТРЕБУЕТ DOTNET (Зависимый ZIP + Обычный EXE) ---
    - name: Publish Framework-Dependent (Requires .NET)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false -o ./pub-dependent /p:PublishSingleFile=true /p:PublishTrimmed=false /p:IncludeNativeLibrariesForSelfExtract=true
        # Копируем чистый .exe отдельно для релиза
        Copy-Item -Path ./pub-dependent/PcMonitor.exe -DestinationPath ./PcMonitor_Requires_Dotnet.exe
        # Архивируем всю папку сборки (включая dll от SQLite, если они не вшились)
        Compress-Archive -Path ./pub-dependent/* -DestinationPath ./PcMonitor_Dependent_win-x64.zip

    # --- 3. ЗАГРУЗКА ВСЕХ АРТИФАКТОВ В РЕЛИЗ GitHub ---
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./PcMonitor_Autonomous_win-x64.zip
          ./PcMonitor_Dependent_win-x64.zip
          ./PcMonitor_Requires_Dotnet.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
